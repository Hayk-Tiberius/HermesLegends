<!doctype html>
<html lang="en">
  <head>
    <title>HermesLegends404</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <script defer src="script.js"></script>
  </head>
  <body>
    <article>
      <img src="img/Main.png" alt="Main" class="main_photo" />
    </article>
    <section>
      <div class="Legends">
        <div class="Legends_block">
          <div class="Legends_portfolio">
            <div class="Legends_photo"></div>
            <div class="buttons">
              <div class="music">
                <span
                  ><i
                    class="fa fa-volume-up fa-2x"
                    style="color: rgb(255, 255, 255); opacity: 0.5"
                  ></i
                ></span>
                <audio src="img/img_legends/Klimenova/theme.mp3" style="display: inline"></audio>
              </div>
              <div class="animate">
                <i
                  class="fa fa-font"
                  style="font-size: 1.75rem; color: rgb(255, 255, 255); opacity: 0.5"
                ></i>
              </div>
            </div>
            <div class="Legends_name">Varvara Klimenova</div>
          </div>
          <img src="img/img_legends/Klimenova/theme.gif" alt="" class="Legends_img" />
        </div>
        <div class="Legends_block">
          <img src="img/img_legends/Kuzin/theme.jpg" alt="" class="Legends_img" />
          <div class="Legends_portfolio">
            <div class="Legends_photo"></div>
            <div class="buttons">
              <div class="music">
                <span
                  ><i
                    class="fa fa-volume-up fa-2x"
                    style="color: rgb(255, 255, 255); opacity: 0.5"
                  ></i
                ></span>
                <audio src="img/img_legends/Kuzin/theme.mp3" style="display: inline"></audio>
              </div>
              <div class="animate">
                <i
                  class="fa fa-font"
                  style="font-size: 1.75rem; color: rgb(255, 255, 255); opacity: 0.5"
                ></i>
              </div>
            </div>
            <div class="Legends_name">Grigoriy Kuzin</div>
          </div>
        </div>
        <div class="Legends_block">
          <img src="img/img_legends/Nikolayev/theme.gif" alt="" class="Legends_img" />
          <div class="Legends_portfolio">
            <div class="Legends_photo"></div>
            <div class="buttons">
              <div class="music">
                <span
                  ><i
                    class="fa fa-volume-up fa-2x"
                    style="color: rgb(255, 255, 255); opacity: 0.5"
                  ></i
                ></span>
                <audio src="img/img_legends/Nikolayev/theme.mp3" style="display: inline"></audio>
              </div>
              <div class="animate">
                <i
                  class="fa fa-font"
                  style="font-size: 1.75rem; color: rgb(255, 255, 255); opacity: 0.5"
                ></i>
              </div>
            </div>
            <div class="Legends_name">Alexey Nikolayev</div>
          </div>
        </div>
        <div class="Legends_block">
          <img src="img/img_legends/Mishin/theme.png" alt="" class="Legends_img" />
          <div class="Legends_portfolio">
            <div class="Legends_photo">
              <img src="img/img_legends/Mishin/profile.png" alt="profile" class="profile" />
            </div>
            <div class="buttons">
              <div class="music">
                <span
                  ><i
                    class="fa fa-volume-up fa-2x"
                    style="color: rgb(255, 255, 255); opacity: 0.5"
                  ></i
                ></span>
                <audio src="img/img_legends/Mishin/theme.mp3" style="display: inline"></audio>
              </div>
              <div class="animate">
                <i
                  class="fa fa-font"
                  style="font-size: 1.75rem; color: rgb(255, 255, 255); opacity: 0.5"
                ></i>
              </div>
            </div>
            <div class="Legends_name"><span>Ivan Mishin</span></div>
          </div>
        </div>
        <div class="Legends_block">
          <img src="img/img_legends/Lipin/theme.gif" alt="" class="Legends_img" />
          <div class="Legends_portfolio">
            <div class="Legends_photo"></div>
            <div class="buttons">
              <div class="music">
                <span
                  ><i
                    class="fa fa-volume-up fa-2x"
                    style="color: rgb(255, 255, 255); opacity: 0.5"
                  ></i
                ></span>
                <audio src="img/img_legends/Lipin/theme.mp3" style="display: inline"></audio>
              </div>
              <div class="animate">
                <i
                  class="fa fa-font"
                  style="font-size: 1.75rem; color: rgb(255, 255, 255); opacity: 0.5"
                ></i>
              </div>
            </div>
            <div class="Legends_name"><span>Oleg Lipin</span></div>
          </div>
        </div>
        <div class="Legends_block">
          <img src="img/img_legends/Shifrina/theme.gif" alt="" class="Legends_img" />
          <div class="Legends_portfolio">
            <div class="Legends_photo"></div>
            <div class="buttons">
              <div class="music">
                <span
                  ><i
                    class="fa fa-volume-up fa-2x"
                    style="color: rgb(255, 255, 255); opacity: 0.5"
                  ></i
                ></span>
                <audio src="img/img_legends/Shifrina/theme.mp3" style="display: inline"></audio>
              </div>
              <div class="animate">
                <i
                  class="fa fa-font"
                  style="font-size: 1.75rem; color: rgb(255, 255, 255); opacity: 0.5"
                ></i>
              </div>
            </div>
            <div class="Legends_name"><span>Sofya Shifrina</span></div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
